name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV and CMake
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libopencv-dev
      - name: Build the engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSONUX_TOOLS=OFF
          cmake --build build -j"$(nproc)"
      - name: Run the API and test it
        run: |
          ./build/api_server &
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
          tools/test_api.sh http://localhost:8080
